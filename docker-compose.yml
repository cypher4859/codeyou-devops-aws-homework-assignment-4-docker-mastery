version: "3.9"

services:
  app:
    build: .
    ports:
      - 6673:6673
    volumes:
      - spacex:/app/node_modules
    environment:
      - DB_USERNAME=root
      - DB_PASSWORD=toor
      - DB_NAME=spacex
      - DB_HOST=mongo
      - AUTH_DATABASE=auth
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    ports:
      - 27017:27017
    volumes:
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh
    environment:
      - ADMIN_USER=spacex_admin
      - ADMIN_API_KEY=my-secure-api-key
      - MONGO_INITDB_DATABASE=spacex
      - MONGO_AUTH_DATABASE=auth
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=toor

volumes:
  spacex:
    driver: local